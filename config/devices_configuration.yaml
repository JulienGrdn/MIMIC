broker: "broker.ip.address"
virtual_lab: "my_lab"

devices:
  - id: "dummy_power_supply"
    name: "Dummy Power Supply"
    nickname: "DPS"
    device_cat: "Power Supply"
    mqtt_base_topic: "powersupply/serial_number"

    channels:
      - key: "voltage_ch1"
        label: "Voltage (Ch1)"
        description: "Output voltage for Channel 1"
        type: "float"
        mqtt_payload_format: "('dict', 'voltage')" # dictionnary, key -> into a tuple
        access: "read_write"
        unit: "V"
        status_suffix: "voltage/1"
        command_suffix: "SET/voltage/1"

      - key: "voltage_ch1_timestamp"
        label: "Timestamp V Chnl1"
        description: "timestamp voltage for Channel 1"
        type: "str"
        mqtt_payload_format: "('dict', 'timestamp')" # dictionnary, key -> into a tuple
        access: "read"
        status_suffix: "voltage/1"
        special_channel: "('timestamp', 'voltage_ch1')"


      - key: "current_ch1"
        label: "Current (Ch1)"
        description: "Output current for Channel 1"
        type: "float"
        mqtt_payload_format: "('list', 1)" #list, position in list -> into a tuple
        access: "read_write"
        unit: "A"
        status_suffix: "current/1"
        command_suffix: "SET/current/1"

      - key: "output_state_ch1"
        label: "Output Enable"
        type: "boolean"
        access: "read_write"
        status_suffix: "output/1"
        command_suffix: "SET/output/1"

      - key: "sep1"
        type: "ui_sep"

      - key: "voltage_ch2"
        label: "Voltage (Ch2)"
        description: "Output voltage for Channel 2"
        type: "float"
        access: "read_write"
        unit: "V"
        status_suffix: "voltage/2"
        command_suffix: "SET/voltage/2"

      - key: "current_ch2"
        label: "Current (Ch2)"
        description: "Output current for Channel 2"
        type: "float"
        access: "read_write"
        unit: "A"
        status_suffix: "current/2"
        command_suffix: "SET/current/2"

      - key: "output_state_ch2"
        label: "Output Enable"
        type: "boolean"
        access: "read_write"
        status_suffix: "output/2"
        command_suffix: "SET/output/2"

  - id: "dummy_sensor"
    name: "Dummy Sensor"
    nickname: "DS"
    device_cat: "Sensor"
    mqtt_base_topic: "Sensor/serial_number"
    channels:
      - key: "counts"
        label: "Counts"
        type: "integer"
        access: "read"
        status_suffix: "counts"

      - key: "signal"
        label: "Signal"
        type: "float"
        access: "read"
        status_suffix: "signal"

  - id: "redpitaya_fpi"
    name: "Laser Locking System"
    nickname: "LLS"
    device_cat: "Sensor"
    mqtt_base_topic: "LLS/serial_number"

    channels:
      - key: "locksetpoint"
        label: "Lock Setpoint"
        type: "float"
        access: "write"          # pure write, no special_channel needed here
        unit: "THz"
        command_suffix: "SET/frequency/1"

      - key: "stab_chnl_locksetpoint"
        label: "Locked"
        type: "boolean"
        access: "read"
        status_suffix: "stab"    # subscribes to LLS/serial_number/stab
        special_channel: "('stability', 'self')"
        passive_toggle_parameters: "['locked','unlocked', 'rgba(70, 120, 250, 1)', 'rgba(130, 130, 130, 1)']"  # [true_label, false_label, true_color, false_color]

  - id: "dummy_shutter"
    name: "Dummy Shutter"
    nickname: "DShutter"
    device_cat: "Miscellaneous"
    mqtt_base_topic: "shutter/serial_number"

    channels:
      - key: "output_state"
        label: "Output"
        type: "boolean"
        access: "read_write"
        status_suffix: "out"
        command_suffix: "SET/out"

      - key: "pulse"
        label: "Pulse"
        type: "float"
        unit: "ms"
        access: "write"
        command_suffix: "SET/pulse"

  - id: "dummy_wavemeter"
    name: "Dummy Wavemeter"
    nickname: "DWM"
    device_cat: "Sensor"
    special_device: "wavemeter"
    mqtt_base_topic: "DWM/serial_number"

    channels:
      - key: "chnl1"
        label: "Channel 1"
        type: "float"
        access: "read_write"
        unit: "THz"
        status_suffix: "frequency/1"
        command_suffix: "SET/frequency/1"

      - key: "sep1"
        type: "ui_sep"

      - key: "chnl2"
        label: "Channel 2"
        type: "float"
        access: "read_write"
        mqtt_payload_format: "('dict', 'freq')" # dictionnary, key -> into a tuple
        unit: "THz"
        status_suffix: "frequency/2"
        command_suffix: "SET/frequency/2"

      - key: 'wl_stable_chnl2'
        label: "Channel 2"
        type: 'boolean'
        access: 'read'
        mqtt_payload_format: "('dict', 'stable')" # dictionnary, key -> into a tuple
        status_suffix: "frequency/2"
        special_channel: "('stability', 'chnl2')"

      - key: "sep2"
        type: "ui_sep"

      - key: "chnl3"
        label: "Channel 3"
        type: "float"
        access: "read_write"
        unit: "THz"
        status_suffix: "frequency/3"
        command_suffix: "SET/frequency/3"

      - key: "sep3"
        type: "ui_sep"

      - key: "chnl4"
        label: "Channel 4"
        type: "float"
        access: "read_write"
        unit: "THz"
        status_suffix: "frequency/4"
        command_suffix: "SET/frequency/4"

  - id: "dummy_temp_monitor"
    name: "Lab Temp Monitor"
    nickname: "TempMon"
    device_cat: "Environment"
    mqtt_base_topic: "env/temp1"
    channels:
      - key: "temperature"
        label: "Ambient Temp"
        type: "float"
        access: "read"
        unit: "C"
        status_suffix: "val"

  - id: "dummy_function_gen"
    name: "Function Generator"
    nickname: "FGen"
    device_cat: "Signal Source"
    mqtt_base_topic: "fgen/serial_number"
    channels:
      - key: "frequency"
        label: "Frequency"
        type: "float"
        access: "read_write"
        unit: "Hz"
        status_suffix: "freq"
        command_suffix: "SET/freq"
      - key: "amplitude"
        label: "Amplitude"
        type: "float"
        access: "read_write"
        unit: "Vpp"
        status_suffix: "amp"
        command_suffix: "SET/amp"
      - key: "offset"
        label: "DC Offset"
        type: "float"
        access: "read_write"
        unit: "V"
        status_suffix: "offset"
        command_suffix: "SET/offset"
      - key: "output_state"
        label: "RF Out"
        type: "boolean"
        access: "read_write"
        status_suffix: "out"
        command_suffix: "SET/out"

  - id: "dummy_vacuum_controller"
    name: "Vacuum Controller"
    nickname: "VacCtrl"
    device_cat: "Environment"
    mqtt_base_topic: "vacuum/main"
    channels:
      - key: "pressure_chamber"
        label: "Main Chamber"
        type: "float"
        access: "read"
        unit: "mbar"
        status_suffix: "p1"
      - key: "pressure_foreline"
        label: "Foreline"
        type: "float"
        access: "read"
        unit: "mbar"
        status_suffix: "p2"
      - key: "sep1"
        type: "ui_sep"
      - key: "roughing_pump"
        label: "Roughing Pump"
        type: "boolean"
        access: "read_write"
        status_suffix: "rp_state"
        command_suffix: "SET/rp"
      - key: "turbo_pump"
        label: "Turbo Pump"
        type: "boolean"
        access: "read_write"
        status_suffix: "tp_state"
        command_suffix: "SET/tp"
      - key: "turbo_speed"
        label: "Turbo Speed"
        type: "integer"
        access: "read"
        unit: "RPM"
        status_suffix: "tp_speed"

  - id: "dummy_interlock"
    name: "Safety Interlock"
    nickname: "Safety"
    device_cat: "Miscellaneous"
    mqtt_base_topic: "safety/interlock"
    channels:
      - key: "door_status"
        label: "Lab Door"
        type: "boolean"
        access: "read"
        status_suffix: "door"
        special_channel: "('stability', 'self')"
        passive_toggle_parameters: "['Close','Open', 'rgba(70, 120, 250, 1)', 'rgba(130, 130, 130, 1)']"
      - key: "laser_enable"
        label: "Laser Enable"
        type: "boolean"
        access: "read_write"
        status_suffix: "laser"
        command_suffix: "SET/laser"

  - id: "dummy_piezo_driver"
    name: "3-Axis Piezo Driver"
    nickname: "Piezo"
    device_cat: "Motion Control"
    mqtt_base_topic: "piezo/stage1"
    channels:
      - key: "x_axis"
        label: "X Axis"
        type: "float"
        access: "read_write"
        unit: "um"
        status_suffix: "x/pos"
        command_suffix: "SET/x/pos"
      - key: "y_axis"
        label: "Y Axis"
        type: "float"
        access: "read_write"
        unit: "um"
        status_suffix: "y/pos"
        command_suffix: "SET/y/pos"
      - key: "z_axis"
        label: "Z Axis"
        type: "float"
        access: "read_write"
        unit: "um"
        status_suffix: "z/pos"
        command_suffix: "SET/z/pos"

  - id: "dummy_photodiode"
    name: "Amplified Photodiode"
    nickname: "APD"
    device_cat: "Sensor"
    mqtt_base_topic: "apd/1"
    channels:
      - key: "voltage_out"
        label: "Signal Level"
        type: "float"
        access: "read"
        unit: "V"
        status_suffix: "sig"

  - id: "dummy_switch_array"
    name: "Relay Matrix"
    nickname: "Relays"
    device_cat: "Miscellaneous"
    mqtt_base_topic: "relays/matrix1"
    channels:
      - key: "r1"
        label: "Relay 1"
        type: "boolean"
        access: "read_write"
        status_suffix: "1"
        command_suffix: "SET/1"
      - key: "r2"
        label: "Relay 2"
        type: "boolean"
        access: "read_write"
        status_suffix: "2"
        command_suffix: "SET/2"
      - key: "r3"
        label: "Relay 3"
        type: "boolean"
        access: "read_write"
        status_suffix: "3"
        command_suffix: "SET/3"
      - key: "r4"
        label: "Relay 4"
        type: "boolean"
        access: "read_write"
        status_suffix: "4"
        command_suffix: "SET/4"
      - key: "r5"
        label: "Relay 5"
        type: "boolean"
        access: "read_write"
        status_suffix: "5"
        command_suffix: "SET/5"

  - id: "dummy_pid_controller"
    name: "Hardware PID"
    nickname: "PID1"
    device_cat: "Control"
    mqtt_base_topic: "pid/1"
    channels:
      - key: "p_gain"
        label: "Proportional"
        type: "float"
        access: "read_write"
        status_suffix: "p"
        command_suffix: "SET/p"
      - key: "i_gain"
        label: "Integral"
        type: "float"
        access: "read_write"
        status_suffix: "i"
        command_suffix: "SET/i"
      - key: "d_gain"
        label: "Derivative"
        type: "float"
        access: "read_write"
        status_suffix: "d"
        command_suffix: "SET/d"
      - key: "sep1"
        type: "ui_sep"
      - key: "setpoint"
        label: "Setpoint"
        type: "float"
        access: "read_write"
        status_suffix: "sp"
        command_suffix: "SET/sp"
      - key: "enable"
        label: "PID Enable"
        type: "boolean"
        access: "read_write"
        status_suffix: "en"
        command_suffix: "SET/en"

  - id: "dummy_clock"
    name: "Atomic Clock Ref"
    nickname: "Rubidium"
    device_cat: "Signal Source"
    mqtt_base_topic: "clock/rb1"
    channels:
      - key: "locked"
        label: "Rb Lock Status"
        type: "boolean"
        access: "read"
        status_suffix: "lock"
        special_channel: "('stability', 'self')"
      - key: "10mhz_out"
        label: "10 MHz Output"
        type: "boolean"
        access: "read_write"
        status_suffix: "out"
        command_suffix: "SET/out"

  - id: "dummy_environmental_chamber"
    name: "Thermal Chamber"
    nickname: "Oven"
    device_cat: "Environment"
    mqtt_base_topic: "oven/1"
    channels:
      - key: "current_temp"
        label: "Actual Temp"
        type: "float"
        access: "read"
        unit: "C"
        status_suffix: "temp"
      - key: "target_temp"
        label: "Target Temp"
        type: "float"
        access: "read_write"
        unit: "C"
        status_suffix: "target"
        command_suffix: "SET/target"
      - key: "humidity"
        label: "Humidity"
        type: "float"
        access: "read"
        unit: "%"
        status_suffix: "rh"
      - key: "sep1"
        type: "ui_sep"
      - key: "heater_power"
        label: "Heater Output"
        type: "float"
        access: "read"
        unit: "%"
        status_suffix: "power"
